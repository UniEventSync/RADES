project_id = "rades"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "env(SMTP_HOST)"
port = 465
user = "env(SMTP_USER)"
pass = "env(SMTP_PASSWORD)"
admin_email = "env(SMTP_FROM_EMAIL)"
sender_name = "RADES"

[auth.email.template.confirmation]
subject = "Confirm your RADES account"
content_path = "./supabase/email-templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Reset your RADES password"
content_path = "./supabase/email-templates/reset-password.html"

[auth.email.template.invite]
subject = "You’re invited to RADES"
content_path = "./supabase/email-templates/invite-user.html"
