<div
  style="
    margin: 0;
    background: #f8fafc;
    padding: 32px 12px;
    font-family: Arial, Helvetica, sans-serif;
    color: #0f172a;
  "
>
  <div
    style="
      max-width: 520px;
      margin: auto;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
    "
  >
    <div style="font-size: 22px; font-weight: 700; color: #1d4ed8">RADES</div>
    <div
      style="
        font-size: 11px;
        letter-spacing: 1px;
        color: #64748b;
        margin-top: 4px;
      "
    >
      IBA KARACHI
    </div>
    <h1 style="font-size: 22px; margin: 28px 0 8px">Reset your password</h1>
    <p style="font-size: 15px; line-height: 1.7; color: #475569">
      Enter this one-time code on RADES to choose a new password. If you did not
      request a reset, ignore this email.
    </p>
    <div
      style="
        margin: 24px 0;
        padding: 18px;
        background: #f1f5f9;
        border-radius: 10px;
        text-align: center;
        font: 700 30px monospace;
        letter-spacing: 8px;
      "
    >
      {{ .Token }}
    </div>
    <p
      style="
        font-size: 12px;
        color: #64748b;
        border-top: 1px solid #e2e8f0;
        padding-top: 16px;
      "
    >
      Sent by RADES · SMCS, IBA Karachi
    </p>
  </div>
</div>
